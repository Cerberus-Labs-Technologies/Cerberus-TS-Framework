# Copy to config/cerberus.properties. Environment variables override file values.
# Keys map to CERBERUS_ + uppercase + dots replaced with underscores.
generation=TS6
transport=SSH
host=localhost
port=10022
username=serveradmin
# Supply CERBERUS_PASSWORD, or configure private.key (and optional CERBERUS_PASSWORD as passphrase).
# known.hosts=/home/cerberus/.ssh/known_hosts
server.id=1
nickname=Cerberus TS
command.prefix=!
command.interval.ms=350
command.timeout.ms=10000
connect.timeout.ms=10000
keepalive.ms=60000
reconnect.attempts=10
reconnect.delay.ms=10000
data.directory=data
plugin.directory=plugins
# Music plugin: FFmpeg for decoding, yt-dlp + JavaScript runtime for YouTube.
music.ffmpeg=ffmpeg
music.ytdlp=yt-dlp
music.js.runtime=node
music.max.bots=4
music.max.queue=100
# Music files: <data.directory>/music/files; identities: <data.directory>/music/identities.
# CERBERUS_VOICE_PASSWORD is the optional voice server password, separate from the Query password.
# Bootstrap a trusted administrator using the stable TeamSpeak unique ID:
# admin.uid=...
# Optional REST (Bearer tokens with method/path scopes; loopback by default):
# rest.port=8080
# rest.host=127.0.0.1
# Web interface (shared REST listener; rest.port takes precedence if configured).
web.enabled=true
web.host=127.0.0.1
web.port=24875
# Run web-token in the local bot console to obtain a 24-hour access token.
# Persistence units: <data.directory>/database/*.yml (see docs/database.md).
# WebQuery: transport=HTTPS, port=10443, CERBERUS_API_KEY=...
# TS3 raw: generation=TS3, transport=RAW, port=10011
