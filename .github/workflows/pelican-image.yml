name: Pelican runtime image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pelican-image.yml'
      - '.dockerignore'
      - 'deploy/pelican/**'
      - 'tools/test_pelican.py'
      - 'src/**'
      - 'examples/**'
      - 'web/**'
      - 'video/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  pull_request:
    paths:
      - '.github/workflows/pelican-image.yml'
      - '.dockerignore'
      - 'deploy/pelican/**'
      - 'tools/test_pelican.py'
      - 'src/**'
      - 'examples/**'
      - 'web/**'
      - 'video/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pelican-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate exports and boot behaviour
        run: python3 tools/test_pelican.py
      - uses: docker/setup-buildx-action@v3
      - name: Build and test JVM distribution in the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/pelican/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cerberus-ts:ci
          cache-from: type=gha,scope=cerberus-pelican-amd64
          cache-to: type=gha,mode=max,scope=cerberus-pelican-amd64
      - name: Exercise the actual non-root runtime
        run: python3 tools/test_pelican.py --image cerberus-ts:ci

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/pelican/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=cerberus-pelican-amd64
            type=gha,scope=cerberus-pelican-multi
          cache-to: type=gha,mode=max,scope=cerberus-pelican-multi
